name: project_flutter
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.5
  record: ^6.2.1
  path_provider: ^2.1.6
  google_fonts: ^8.2.0
  flutter_soloud: ^4.1.3
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  go_router: ^14.8.0
  get_it: ^8.0.3
  injectable: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0

flutter:

  uses-material-design: true

  assets:
    - assets/json/
    - assets/json/lesson/
    - assets/images/
    - assets/icons/
    - assets/sounds/bright/
    - assets/sounds/organ_v2/
    - assets/sounds/rhodes/
    - assets/sounds/synth/


